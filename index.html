<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheatsheet Tag HTML</title>

    <link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
</head>
<body>
<header class="navbar">
    <div class="logo">
        <h2>Belajar Coding</h2>
    </div>

    <div class="search">
        <input type="text" placeholder="Cari sesuatu...">
    </div>

    <div class="menu">
        <button>🏠</button>
        <button>👤</button>
        <button>💬</button>
        <button id="btnTema">🌙</button>
    </div>
</header>

<div class="container">

    <aside class="left">
        <div class="card">
            <img src="https://i.pravatar.cc/100" alt="Foto Profil">
            <h3>Karel</h3>
            <p>Belajar HTML & CSS</p>
        </div>

        <div class="menu-list">
            <p>🏠 Beranda</p>
            <p>👥 Teman</p>
            <p>📷 Foto</p>
            <p>⚙️ Pengaturan</p>
        </div>
    </aside>

    <main class="feed">

        <div class="create-post">
            <input type="text" placeholder="Apa yang sedang Anda pikirkan?">
            <button>Posting</button>
        </div>

        <div class="post">

            <div class="post-header">
                <img src="https://i.pravatar.cc/60">

                <div>
                    <h4>Karel</h4>
                    <small>Baru saja</small>
                </div>

            </div>

            <p>
                Website pertamaku berhasil online 🎉
            </p>

            <img src="https://picsum.photos/700/350">

            <div class="actions">
                <button>👍 Suka</button>
                <button>💬 Komentar</button>
                <button>↗ Bagikan</button>
            </div>

        </div>

        <div class="post">

            <div class="post-header">
                <img src="https://i.pravatar.cc/61">

                <div>
                    <h4>UT Social</h4>
                    <small>10 menit lalu</small>
                </div>

            </div>

            <p>
                Selamat datang di media sosial buatan sendiri.
            </p>

            <div class="actions">
                <button>👍 Suka</button>
                <button>💬 Komentar</button>
                <button>↗ Bagikan</button>
            </div>

        </div>

    </main>

    <aside class="right">

        <div class="card">

            <h3>Teman Online</h3>

            <p>🟢 Budi</p>
            <p>🟢 Sinta</p>
            <p>🟢 Andi</p>
            <p>🟢 Rina</p>

        </div>

    </aside>

</div>

<script src="script.js"></script>

</body>
</html>
